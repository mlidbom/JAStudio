name: CI

on:
  push:
    #branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init required submodules
        run: git submodule update --init submodules/pythonnet-stub-generator

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # JAStudio generates its dictionary's database from JMdict where there is none, which took about a minute of each run on a clean
      # runner. JAStudio.Dictionary generates it, and its project file names the Wacton.Desu version it's generated from.
      - name: Cache the generated dictionary database
        uses: actions/cache@v4
        with:
          path: ~/.local/share/JAStudio/jmdict.db
          key: jmdict-db-${{ runner.os }}-${{ hashFiles('src/src_dotnet/JAStudio.Dictionary/**/*.cs', 'src/src_dotnet/JAStudio.Dictionary/*.csproj') }}

      - name: Setup dev environment
        run: ./setup-dev.sh

      - name: Run .NET tests
        env:
          JASTUDIO_VENV_PATH: ${{ github.workspace }}/venv
        run: >
          dotnet test JAStudio.slnx
          --verbosity quiet
          --logger "console;verbosity=minimal"
          --filter "FullyQualifiedName!~BulkLoaderTests"

      - name: Run Python tests
        run: |
          source venv/bin/activate
          pytest src/tests/jaspythonutils_tests -v
